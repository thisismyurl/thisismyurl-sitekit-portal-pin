name: Initialize Wiki
on:
  workflow_dispatch:
jobs:
  init-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HOME_B64: 
      INSTALL_B64: 
      CONFIG_B64: 
      HOW_B64: 
      CLI_B64: 
      TROUBLE_B64: 
      CHANGE_B64: 
    steps:
      - name: Write and push wiki pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PYEOF'
          import base64, os, subprocess, sys

          token = os.environ['GH_TOKEN']
          repo  = os.environ['REPO']

          pages = {
            'Home.md':              os.environ['HOME_B64'],
            'Installation.md':      os.environ['INSTALL_B64'],
            'Configuration.md':     os.environ['CONFIG_B64'],
            'How-It-Works.md':      os.environ['HOW_B64'],
            'WP-CLI-Reference.md':  os.environ['CLI_B64'],
            'Troubleshooting.md':   os.environ['TROUBLE_B64'],
            'Changelog.md':         os.environ['CHANGE_B64'],
          }

          subprocess.run(['git','config','--global','user.email','actions@github.com'], check=True)
          subprocess.run(['git','config','--global','user.name','github-actions[bot]'], check=True)

          wiki_url = f'https://x-access-token:{token}@github.com/{repo}.wiki.git'

          try:
            subprocess.run(['git','clone', wiki_url, 'wiki'], check=True)
          except subprocess.CalledProcessError:
            import os as _os
            _os.makedirs('wiki', exist_ok=True)
            subprocess.run(['git','init'], cwd='wiki', check=True)
            subprocess.run(['git','remote','add','origin', wiki_url], cwd='wiki', check=True)

          for fname, b64 in pages.items():
            path = os.path.join('wiki', fname)
            with open(path, 'wb') as f:
              f.write(base64.b64decode(b64))
            print(f'Wrote {fname}')

          subprocess.run(['git','add','.'], cwd='wiki', check=True)
          subprocess.run(['git','commit','-m','wiki: initialize all pages'], cwd='wiki', check=True)
          subprocess.run(['git','push','origin','HEAD:master','--force'], cwd='wiki')
          subprocess.run(['git','push','origin','HEAD:main','--force'], cwd='wiki')
          print('Done')
          PYEOF
