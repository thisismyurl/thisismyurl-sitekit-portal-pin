| [[WP-CLI Reference]] | `wp sitekit-pin snapshot`, `restore`, `status` — flags, output, exit codes |
| [[Troubleshooting]] | Common failure modes and how to diagnose them |
| [[Changelog]] | Version history (mirrors CHANGELOG.md) |

---

## Requirements

- WordPress 6.0+
- PHP 7.4+
- WP Engine (dev and prod must share the same `wp-config.php` salts)
- Google Site Kit plugin active on production
EOF

          git add Home.md
          git diff --cached --quiet || git commit -m "wiki: Home page"
          git push origin HEAD:master --force 2>/dev/null || git push origin HEAD:main --force
